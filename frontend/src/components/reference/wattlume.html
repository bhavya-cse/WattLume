<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WattLume — Energy, made visible</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#EEF1FB;--bg2:#E3E9FA;--card:rgba(255,255,255,.78);--ink:#0E1633;--mute:#5E6A8C;--line:rgba(14,22,51,.09);--ind:#4B5FE0;--aqua:#12C4B4;--amber:#F5A524;--coral:#F0506E;--mint:#25C486;--side:#0E1633;--shadow:0 10px 40px -18px rgba(40,56,140,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0F22;--bg2:#10183A;--card:rgba(24,32,66,.72);--ink:#EAEFFF;--mute:#93A0C8;--line:rgba(255,255,255,.09);--side:#070B1A;--shadow:0 10px 40px -18px #000}}
:root[data-theme="dark"]{--bg:#0A0F22;--bg2:#10183A;--card:rgba(24,32,66,.72);--ink:#EAEFFF;--mute:#93A0C8;--line:rgba(255,255,255,.09);--side:#070B1A;--shadow:0 10px 40px -18px #000}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 400px at 85% -5%,rgba(75,95,224,.28),transparent),radial-gradient(600px 400px at 10% 100%,rgba(18,196,180,.2),transparent),var(--bg)}
aside{width:248px;flex:none;background:var(--side);color:#EAEFFF;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:26px;padding:4px 10px 20px;letter-spacing:-.5px}.logo b{color:var(--aqua);font-weight:800}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#9AA7D2;text-decoration:none;font-weight:600;position:relative;transition:.2s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}.nav.on{background:linear-gradient(90deg,rgba(75,95,224,.55),rgba(18,196,180,.18));color:#fff}
.nav.dim{opacity:.4;pointer-events:none}.nav i{font-style:normal;width:22px;text-align:center}
.nav em{margin-left:auto;font-style:normal;font-size:12px;background:var(--coral);color:#fff;border-radius:99px;padding:1px 8px}
.sep{font-size:13px;color:#6B78A6;padding:14px 12px 4px}
.live{margin-top:auto;border-radius:16px;padding:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.live div{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#9AA7D2}.live strong{font-size:26px;color:#fff}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--aqua),var(--ind),var(--amber));transition:width .8s}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:6px;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,196,134,.7)}100%{box-shadow:0 0 0 10px rgba(37,196,134,0)}}
main{flex:1;min-width:0;padding:34px clamp(18px,3vw,44px) 60px;overflow-y:auto;height:100vh}
h1{font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.sub{color:var(--mute);margin:8px 0 26px;max-width:60ch}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1.7fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.card.s{border-radius:16px;padding:18px}
h3{font-size:18px;font-weight:600;margin-bottom:4px}.note{color:var(--mute);font-size:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:28px 34px;border-radius:28px;color:#fff;background:linear-gradient(120deg,#1B2A8F,#4B5FE0 55%,#12C4B4);margin-bottom:18px;overflow:hidden;position:relative;box-shadow:0 24px 60px -24px rgba(75,95,224,.7)}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.ring{position:relative;width:170px;height:170px}.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font-size:42px;line-height:1}
.ring circle.f{stroke-dasharray:408;stroke-dashoffset:408;animation:sweep 1.6s .2s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 8px rgba(255,255,255,.7))}
@keyframes sweep{to{stroke-dashoffset:var(--o)}}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:6px 14px;font-size:14px;backdrop-filter:blur(6px)}
.hero h2{font-size:clamp(22px,2.6vw,32px);font-weight:800;letter-spacing:-.8px;max-width:22ch}
.chart{width:100%;height:auto;overflow:visible}.chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fi 1s 1.6s forwards}@keyframes fi{to{opacity:1}}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;margin-bottom:16px}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-content:center;font-size:22px}
.track{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:7px}.track span{display:block;height:100%;border-radius:9px;width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.t-mint{background:rgba(37,196,134,.16);color:var(--mint)}.t-red{background:rgba(240,80,110,.15);color:var(--coral)}.t-amb{background:rgba(245,165,36,.18);color:var(--amber)}.t-ind{background:rgba(75,95,224,.16);color:var(--ind)}
.btn{border:0;border-radius:12px;padding:11px 20px;font:600 15px inherit;font-family:inherit;background:var(--ink);color:var(--bg);cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--ind)}.btn:focus-visible,.nav:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.btn.ok{background:var(--mint);color:#04261a}
.alert{border-left:6px solid var(--c);transition:.5s}.alert.done{opacity:.55;border-left-color:var(--mint)}
.alert h4{font-size:18px;margin:12px 0}.alert p b{display:block;font-size:13px;color:var(--mute);margin-top:12px;font-weight:600}
.stat strong{display:block;font-size:clamp(28px,3vw,40px);letter-spacing:-1px;margin-top:6px}
.slab{border-top:5px solid var(--c)}.slab strong{font-size:30px;display:block;margin:10px 0 4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.seg button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:18px 8px;font:600 22px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.seg button small{display:block;font-size:13px;color:var(--mute);font-weight:400}.seg button.on{border-color:var(--ind);background:rgba(75,95,224,.14);transform:translateY(-3px)}
input[type=range]{width:100%;accent-color:var(--ind);height:30px}
.view{animation:vin .5s both}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
[data-motion=off] *,[data-motion=off] *::before{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media(max-width:980px){body{display:block}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}.logo{padding:4px 10px}.sep,.live,.nav.dim{display:none}main{height:auto;overflow:visible}.g2,.g3,.g4,.hero{grid-template-columns:1fr}.hero{justify-items:start}}
</style>
</head>
<body>
<aside>
<div class="logo">watt<b>lume</b></div>
<div class="sep">Monitor</div>
<a class="nav" href="#overview"><i>⚡</i>Overview</a>
<a class="nav dim" href="#overview"><i>📊</i>Analytics</a>
<a class="nav" href="#appliances"><i>🔌</i>Appliances<em style="background:var(--ind)">9</em></a>
<div class="sep">Manage</div>
<a class="nav" href="#insights"><i>💡</i>Smart Insights<em id="bd">1</em></a>
<a class="nav" href="#bills"><i>🧾</i>Bills</a>
<a class="nav" href="#reports"><i>📄</i>Reports</a>
<a class="nav" href="#settings"><i>⚙️</i>Settings</a>
<div class="live"><div><span><span class="dot"></span>Live power</span><span><strong id="kw">2.00</strong> kW</span></div><div class="bar"><span id="kwb" style="width:50%"></span></div></div>
</aside>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s),m=$('#m');
let S={speed:1,thr:30,motion:true},pw=2;
const hrs=[.05,.4,.9,.72,.7,.8,1.1,2.9,1.2,2.4,2.2,.6,.5,.45,.5,.9,1.9,1.1,.9,1.4,1.5,1.4,1,1.2];
const apps=[['Inverter Air Conditioner','❄️',52.7,16.8,'var(--ind)','rgba(75,95,224,.15)'],['Storage Water Heater','🚿',23.5,7.5,'var(--mint)','rgba(37,196,134,.15)'],['Convection Microwave','🍲',6.1,1.9,'var(--amber)','rgba(245,165,36,.18)'],['Double-Door Refrigerator','🧊',5.1,1.6,'var(--aqua)','rgba(18,196,180,.16)']];
const alerts=[['+158.5%','Unusual 7 PM spike','2026-11-09 19:00','Usage hit 3,760W, 158.5% above your usual 7 PM level (1,455W). Main cause: the storage water heater (1,943W).','Unattended spikes push you into higher billing slabs and can mean a stuck thermostat.','Check the heater’s switch in Appliances, or lower its thermostat setpoint.','var(--coral)',0],['+62.4%','Cooling load stayed high','2026-11-06 14:48','The air conditioner compressor ran at 1,850W for 4+ hours, 62% over the evening norm. A window may be open or the thermostat faulty.','Continuous compressor runs raise both your bill and wear on the unit.','Close windows, then check the thermostat setpoint.','var(--amber)',1],['+388%','Midnight standby surge','2026-10-30 02:48','Night-time load reached 2.2 kW at 3 AM; the normal level is under 0.45 kW.','Hidden night loads quietly add up across a month.','Switch off devices left running overnight.','var(--coral)',1],['+84.5%','Geyser ran during peak tariff','2026-10-19 11:48','The geyser drew 2.1 kW in peak hours (18:00–19:00), adding ₹19.80 to that hour’s cost.','Peak-hour heating costs more per unit.','Shift geyser heating to before 17:00.','var(--amber)',1]];
const cnt=()=>document.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n,d=e.dataset.d|0,p=e.dataset.p||'',t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1400),v=t*(1-Math.pow(1-k,3));e.textContent=p+v.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});k<1&&requestAnimationFrame(f)})(t0)});
const grow=()=>requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),60));
function smooth(p){let d='M'+p[0];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],mx=(a[0]+b[0])/2;d+=`C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}`}return d}
const V={};
V.overview=()=>{const W=760,H=260,x=i=>40+i*(W-60)/23,y=v=>H-30-v/3.2*(H-60),pts=hrs.map((v,i)=>[x(i),y(v)]),d=smooth(pts);
return `<div class="hero"><div class="ring"><svg width="170" height="170"><defs><linearGradient id="rg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9EF3EA"/></linearGradient></defs><circle cx="85" cy="85" r="65" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="14"/><circle class="f" cx="85" cy="85" r="65" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" style="--o:${408-408*pw/4}"/></svg><div class="c"><b data-n="${pw}" data-d="2">0</b><span>kW right now</span></div></div>
<div><h2>Your home is running 9.1% lighter than last month.</h2><div class="chips"><span class="chip">❄️ AC is 53% of today</span><span class="chip">📉 90 kWh saved so far</span><span class="chip">💰 Save ₹740 / mo available</span></div></div></div>
<div class="grid g2"><div class="card"><h3>Today’s energy curve</h3><p class="note">Hourly kWh. The amber band marks peak tariff hours (17:00–21:00).</p>
<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4B5FE0" stop-opacity=".4"/><stop offset="1" stop-color="#4B5FE0" stop-opacity="0"/></linearGradient><linearGradient id="lg"><stop offset="0" stop-color="#12C4B4"/><stop offset=".5" stop-color="#4B5FE0"/><stop offset="1" stop-color="#F0506E"/></linearGradient></defs>
<rect x="${x(17)}" y="20" width="${x(21)-x(17)}" height="${H-50}" rx="10" fill="rgba(245,165,36,.2)"/>
${[0,1,2,3].map(g=>`<line x1="40" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="0" y="${y(g)+4}" fill="var(--mute)" font-size="12">${g} kWh</text>`).join('')}
${[0,4,8,12,16,20].map(h=>`<text x="${x(h)-14}" y="${H-6}" fill="var(--mute)" font-size="12">${String(h).padStart(2,'0')}:00</text>`).join('')}
<path class="fadein" d="${d}L${x(23)},${y(0)}L${x(0)},${y(0)}Z" fill="url(#ag)"/><path class="ln" pathLength="1" d="${d}" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>
<circle class="fadein" cx="${x(7)}" cy="${y(2.9)}" r="7" fill="var(--coral)"/><text class="fadein" x="${x(7)+14}" y="${y(2.9)+4}" fill="var(--coral)" font-size="13" font-weight="600">Peak 2.9 kWh · 07:00</text></svg>
<p class="note">🕐 Lowest hour so far: 0.05 kWh at 00:00</p></div>
<div class="card"><h3>Where it goes</h3><p class="note" style="margin-bottom:18px">Share of today’s electricity.</p>${apps.map(a=>`<div class="row"><div class="ico" style="background:${a[5]}">${a[1]}</div><div><b>${a[0]}</b><div class="track"><span data-w="${a[2]}" style="background:${a[4]}"></span></div></div><div style="text-align:right"><b>${a[2]}%</b><div class="note">${a[3]} kWh</div></div></div>`).join('')}<a href="#settings" class="tag t-ind" style="text-decoration:none">Virtual switches</a></div></div>
<div class="grid g2" style="grid-template-columns:1fr 1fr;margin-top:18px"><div class="card"><div class="hdr"><div><h3>This month vs last</h3><p class="note">Projected usage against your baseline.</p></div><a href="#bills" class="tag t-ind" style="text-decoration:none">View billing</a></div><div style="margin:22px 0 14px"><div class="note">Last month · 989 kWh</div><div class="track" style="height:18px"><span data-w="98.9" style="background:#9AA5C6"></span></div></div><div><div class="note">This month (est.) · 899 kWh</div><div class="track" style="height:18px"><span data-w="89.9" style="background:linear-gradient(90deg,var(--ind),var(--aqua))"></span></div></div><p style="margin-top:20px"><span class="tag t-mint">↘ 9.1% lower · 90 kWh less</span></p></div>
<div class="card" style="background:linear-gradient(140deg,rgba(37,196,134,.18),var(--card))"><div class="hdr"><h3>✨ Best saving this week</h3><span class="tag t-mint">Save ₹740 / mo</span></div><h4 style="font-size:22px;margin:16px 0 8px;letter-spacing:-.5px">Your AC is 53% of your energy footprint</h4><p class="note" style="font-size:15px;line-height:1.5">Raise the thermostat from 22°C to 24°C, or set a 3-hour sleep timer before dawn, to cut compressor load by up to 18%.</p><p style="margin:14px 0"><span class="tag t-red">High impact</span> <span class="tag t-ind">Inverter AC 1.5 Ton</span></p><button class="btn" onclick="this.className='btn ok';this.textContent='✓ Recommendation applied'">Apply recommendation</button> <a href="#insights" class="tag t-ind" style="text-decoration:none">View all insights</a></div></div>`};
V.insights=()=>`<div class="hdr"><div><h1>Smart Insights</h1><p class="sub">We watch for unusual usage and tell you what to do about it. Red alerts need action, amber ones are worth a look, green ones are handled.</p></div><span class="tag t-amb">Sensitivity ${(1+S.thr/100).toFixed(2)}σ · +${S.thr}%</span></div>
<div class="grid g3" style="align-items:start">${alerts.map((a,i)=>`<div class="card alert ${a[7]?'done':''}" style="--c:${a[6]}" id="al${i}"><div class="hdr"><span class="tag ${a[6].includes('coral')?'t-red':'t-amb'}">${a[0]} spike</span><span class="note">${a[2]}</span></div><h4>${a[1]}</h4><p class="note"><b>What happened</b>${a[3]}<b>Why it matters</b>${a[4]}<b>What you can do</b>${a[5]}</p><div class="hdr" style="margin-top:18px;align-items:center"><span class="note">ALRT-${i?i:1407}</span>${a[7]?'<span class="tag t-mint">✓ Acknowledged</span>':`<button class="btn" onclick="ack(${i},this)">Acknowledge</button>`}</div></div>`).join('')}</div>`;
V.bills=()=>{const sl=[['Slab 1 · 1–100 kWh','₹4.5/unit',100,450,'var(--mint)',33],['Slab 2 · 101–300 kWh','₹7/unit',200,1400,'var(--amber)',66],['Slab 3 · Above 300 kWh','₹9.5/unit',599.05,5690.93,'var(--coral)',100]];
const W=900,H=240,X=d=>50+d*(W-70)/30,Y=v=>H-30-v/1000*(H-50),cu=[],k=[0,5,12,20,30,45,60,80,100,129,160,199,233,265,296,329.65];
return `<div class="hdr"><div><h1>Bills &amp; Tariffs</h1><p class="sub">How your units turn into rupees. Higher slabs cost more, so the last units of the month are the most expensive.</p></div><button class="btn">Configure tariff rules</button></div>
<div class="grid g4">${[['Forecasted total',8044,0,'19 days left in cycle','var(--ind)'],['Month to date',2364,0,'329.65 kWh used','var(--aqua)'],['Unit rate',8.95,2,'Avg daily ₹214.93','var(--amber)'],['Previous invoice',8939,0,'988.82 kWh','var(--mute)']].map(c=>`<div class="card s stat" style="border-bottom:5px solid ${c[4]}"><span class="note">${c[0]}</span><strong>₹<span data-n="${c[1]}" data-d="${c[2]}">0</span></strong><span class="note">${c[3]}</span></div>`).join('')}</div>
<div class="card" style="margin:18px 0"><div class="hdr"><div><h3>Slab breakdown</h3><p class="note">Your units fill each slab in order.</p></div><span class="tag t-ind">Fixed ₹120/mo · 5% duty</span></div><div class="grid g3" style="margin-top:16px">${sl.map(s=>`<div class="card s slab" style="--c:${s[4]}"><div class="hdr"><b>${s[0]}</b><span class="tag" style="background:var(--line)">${s[1]}</span></div><strong data-n="${s[2]}" data-d="${s[2]%1?2:0}">0</strong><span class="note">kWh</span><div class="track"><span data-w="${s[5]}" style="background:${s[4]}"></span></div><p style="margin-top:10px;font-weight:600;color:${s[4]}">₹${s[3].toLocaleString('en-IN')}</p></div>`).join('')}</div></div>
<div class="card"><h3>Month trajectory</h3><p class="note">Solid line: used so far. Dashed: where you are heading.</p><svg class="chart" viewBox="0 0 ${W} ${H}">${[0,500,1000].map(g=>`<line x1="50" x2="${W}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="0" y="${Y(g)+4}" fill="var(--mute)" font-size="12">${g} kWh</text>`).join('')}<line x1="${X(11)}" x2="${X(11)}" y1="10" y2="${H-30}" stroke="var(--line)" stroke-dasharray="4"/><text x="${X(11)+6}" y="24" fill="var(--mute)" font-size="12">Today</text><path class="ln" pathLength="1" d="${smooth(k.map((v,i)=>[X(i*11/15),Y(v)]))}" fill="none" stroke="var(--ind)" stroke-width="4" stroke-linecap="round"/><path class="fadein" d="M${X(11)},${Y(329.65)}L${X(30)},${Y(899)}" stroke="var(--mint)" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/><circle class="fadein" cx="${X(30)}" cy="${Y(899)}" r="7" fill="var(--mint)"/><text class="fadein" x="${X(30)-130}" y="${Y(899)-14}" fill="var(--mint)" font-weight="600" font-size="13">Forecast 899 kWh</text></svg></div>`};
V.settings=()=>`<div style="max-width:820px"><h1>Settings &amp; Controls</h1><p class="sub">Tune the simulation, how alerts trigger, and how WattLume looks.</p>
<div class="card" style="margin-bottom:18px"><h3>Simulation speed</h3><p class="note" style="margin-bottom:16px">How quickly simulated readings update.</p><div class="seg">${[1,2,5,10].map(n=>`<button class="${S.speed==n?'on':''}" onclick="S.speed=${n};go()">${n}×<small>${n==1?'Real-time':n+'× speed'}</small></button>`).join('')}</div><p style="margin-top:16px"><span class="tag t-mint"><span class="dot"></span>Engine active</span></p></div>
<div class="card" style="margin-bottom:18px"><div class="hdr"><div><h3>Anomaly sensitivity</h3><p class="note">Lower values flag smaller spikes.</p></div><span class="tag" id="thv">+${S.thr}% above baseline</span></div><input type="range" min="15" max="70" value="${S.thr}" aria-label="Anomaly sensitivity" oninput="S.thr=+this.value;thc(this)" style="margin-top:20px"><div class="hdr note"><span>+15% Strict</span><span>+30% Recommended</span><span>+70% Relaxed</span></div></div>
<div class="card"><h3>Appearance &amp; accessibility</h3><div class="hdr" style="margin:18px 0;align-items:center"><div><b>Colour theme</b><p class="note">Light or charcoal dark.</p></div><button class="btn" onclick="tg()">Switch theme</button></div><div class="hdr" style="align-items:center"><div><b>Reduced motion</b><p class="note">Turns off animations.</p></div><button class="btn" onclick="S.motion=!S.motion;document.documentElement.dataset.motion=S.motion?'on':'off';this.textContent=S.motion?'Off':'On'">${S.motion?'Off':'On'}</button></div></div></div>`;
S.on=[1,1,0,1,0,1,1,0,1];
const AP=[['Inverter Air Conditioner','❄️',1500,'Cooling'],['Storage Water Heater','🚿',1943,'Heating'],['Convection Microwave','🍲',1200,'Kitchen'],['Double-Door Refrigerator','🧊',180,'Always on'],['Washing Machine','🧺',500,'Laundry'],['LED Lighting','💡',120,'Lighting'],['Ceiling Fans','🌀',210,'Cooling'],['Television','📺',110,'Entertainment'],['Wi‑Fi Router','📡',12,'Always on']];
const apc=w=>w>1000?'var(--coral)':w>300?'var(--amber)':'var(--mint)';
function apt(){const t=AP.reduce((a,p,i)=>a+(S.on[i]?p[2]:0),0);$('#apt').textContent=(t/1000).toFixed(2);$('#apn').textContent=S.on.reduce((a,b)=>a+b,0);pw=Math.max(.3,t/1000);}
function tga(i){S.on[i]^=1;const c=$('#ap'+i);c.classList.toggle('off');c.querySelector('button').textContent=S.on[i]?'On':'Off';c.querySelector('button').className='btn'+(S.on[i]?' ok':'');apt()}
V.appliances=()=>{const t=AP.reduce((a,p,i)=>a+(S.on[i]?p[2]:0),0);return `<div class="hdr"><div><h1>Appliances</h1><p class="sub">Every device in your home. Flip a virtual switch to see how your live load changes. Red devices draw the most power, green the least.</p></div><div class="card s" style="text-align:right"><span class="note">Running now</span><strong style="display:block;font-size:34px"><span id="apt">${(t/1000).toFixed(2)}</span> kW</strong><span class="note"><span id="apn">${S.on.reduce((a,b)=>a+b,0)}</span> of 9 on</span></div></div><div class="grid g3">${AP.map((p,i)=>`<div class="card ap ${S.on[i]?'':'off'}" id="ap${i}" style="--c:${apc(p[2])};border-top:5px solid ${apc(p[2])}"><div class="row" style="margin:0"><div class="ico" style="background:var(--line);font-size:26px">${p[1]}</div><div><b>${p[0]}</b><div class="note">${p[3]}</div></div><button class="btn${S.on[i]?' ok':''}" onclick="tga(${i})" aria-label="Toggle ${p[0]}">${S.on[i]?'On':'Off'}</button></div><div class="hdr" style="margin-top:18px;align-items:baseline"><strong style="font-size:30px" data-n="${p[2]}">0</strong><span class="note">watts rated</span></div><div class="track"><span data-w="${p[2]/19.43}" style="background:${apc(p[2])}"></span></div></div>`).join('')}</div>`};
V.reports=()=>{const R=[['Jun 2026',1210,11020],['Jul 2026',1085,9840],['Aug 2026',1120,10150],['Sep 2026',1042,9420],['Oct 2026',989,8939],['Nov 2026 (est.)',899,8044]],tot=R.reduce((a,r)=>a+r[2],0),kw=R.reduce((a,r)=>a+r[1],0);window.rs=`WattLume 6-month summary: ${kw} kWh, ₹${tot}. Latest month is ${Math.abs(((899-989)/989*100)).toFixed(1)}% lower than the one before.`;return `<div class="hdr"><div><h1>Reports</h1><p class="sub">Monthly energy and spend summary. Green means usage fell from the month before, red means it rose.</p></div><button class="btn" onclick="try{navigator.clipboard.writeText(rs);this.textContent='✓ Summary copied'}catch(e){this.textContent='Copy failed'}">Copy summary</button></div><div class="grid g3" style="margin-bottom:18px">${[['Six-month spend',tot,'₹','var(--ind)'],['Average per month',Math.round(tot/6),'₹','var(--aqua)'],['Total energy',kw,'','var(--amber)']].map(c=>`<div class="card s stat" style="border-bottom:5px solid ${c[3]}"><span class="note">${c[0]}</span><strong><span data-n="${c[1]}" data-p="${c[2]}">0</span>${c[2]?'':' kWh'}</strong></div>`).join('')}</div><div class="card"><h3>Monthly energy and expenditure</h3><p class="note" style="margin-bottom:18px">Bars show kWh against your highest month.</p>${R.map((r,i)=>{const ch=i?(r[1]-R[i-1][1])/R[i-1][1]*100:0;return `<div style="display:grid;grid-template-columns:130px 1fr 90px 90px 90px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)"><b>${r[0]}</b><div class="track" style="margin:0;height:12px"><span data-w="${r[1]/12.1}" style="background:${ch>0?'var(--coral)':'linear-gradient(90deg,var(--ind),var(--aqua))'}"></span></div><span>${r[1]} kWh</span><b>₹${r[2].toLocaleString('en-IN')}</b>${i?`<span class="tag ${ch<0?'t-mint':'t-red'}">${ch<0?'↘':'↗'} ${Math.abs(ch).toFixed(1)}%</span>`:'<span class="note">Baseline</span>'}</div>`}).join('')}</div>`};
function thc(e){const t=$('#thv');t.textContent='+'+S.thr+'% above baseline';t.className='tag '+(S.thr<25?'t-red':S.thr<45?'t-mint':'t-amb')}
function tg(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
function ack(i,b){const c=$('#al'+i);c.classList.add('done');b.outerHTML='<span class="tag t-mint">✓ Acknowledged</span>';$('#bd').remove()}
function go(){const v=(location.hash||'#overview').slice(1);const k=V[v]?v:'overview';m.innerHTML='<div class="view">'+V[k]()+'</div>';m.scrollTop=0;document.querySelectorAll('.nav').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+k&&!a.classList.contains('dim')));cnt();grow()}
addEventListener('hashchange',go);go();
setInterval(()=>{pw=Math.max(.3,Math.min(3.6,pw+(Math.random()-.5)*.4));$('#kw').textContent=pw.toFixed(2);$('#kwb').style.width=pw/4*100+'%'},Math.max(300,2000/S.speed));
</script>
</body>
</html>
